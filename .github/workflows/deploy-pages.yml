name: Deploy TengYoda website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare complete website
        shell: bash
        run: |
          mkdir -p _site
          cp -R site/. _site/
          if [ -d article-images ]; then
            mkdir -p _site/article-images
            cp -R article-images/. _site/article-images/
          fi

      - name: Build Markdown articles
        run: python3 tools/publish.py --site _site --articles articles

      - name: Build importer landing pages
        run: python3 tools/publish_pages.py --site _site --pages pages

      - name: Add English-only discovery metadata and verified company facts
        run: python3 tools/enhance_discovery.py --site _site

      - name: Prepare GitHub Pages artifact
        run: touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
